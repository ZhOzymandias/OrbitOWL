name: orbitowl

x-app: &app
  build: .
  user: "${ORBITOWL_UID:?Run python3 scripts/setup.py}:${ORBITOWL_GID:?Run python3 scripts/setup.py}"
  network_mode: host
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment:
    ORBITOWL_DATA: /data
    ORBITOWL_TOKEN_FILE: /run/secrets/orbitowl_token
    ORBITOWL_API_PORT: "${ORBITOWL_PORT:-8110}"
    ORBITOWL_RUNNER_URL: "${ORBITOWL_RUNNER_URL:-http://127.0.0.1:18081}"
    ORBITOWL_CONTEXT: "${ORBITOWL_CONTEXT:-65536}"
    ORBITOWL_MODEL: "${ORBITOWL_MODEL:-qwen3.8:27b}"
  volumes:
    - type: bind
      source: "${ORBITOWL_DATA_DIR:-./.orbitowl/data}"
      target: /data
      bind:
        create_host_path: false
    - type: bind
      source: "${ORBITOWL_TOKEN_FILE:-./.orbitowl/api-token}"
      target: /run/secrets/orbitowl_token
      read_only: true
      bind:
        create_host_path: false
  logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}

services:
  api:
    <<: *app
    image: "${ORBITOWL_API_IMAGE:-orbitowl:local}"
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['ORBITOWL_API_PORT'] + '/health/live', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
  worker:
    <<: *app
    image: "${ORBITOWL_WORKER_IMAGE:-orbitowl:local}"
    command: [python, -m, orbitowl.worker]
