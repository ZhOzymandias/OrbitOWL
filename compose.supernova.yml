name: sinapsia-supernova
x-service: &service
  build: {context: ., dockerfile: Dockerfile.supernova}
  image: sinapsia-supernova:local
  user: ${SUPERNOVA_UID}:${SUPERNOVA_GID}
  network_mode: host
  env_file: [.supernova/service.env]
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes:
    - ${SUPERNOVA_DATA}:${SUPERNOVA_DATA}
    - ${SUPERNOVA_TOKEN_FILE}:${SUPERNOVA_TOKEN_FILE}:ro
    - ${SUPERNOVA_MODEL_PATH}:${SUPERNOVA_MODEL_PATH}:ro
  logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
services:
  api:
    <<: *service
    image: ${ORBITOWL_API_IMAGE:-sinapsia-supernova:local}
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: [CMD,python,-c,"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    <<: *service
    image: ${ORBITOWL_WORKER_IMAGE:-sinapsia-supernova:local}
    command: [python,-m,supernova.worker]
    mem_limit: 2g
    cpus: 2
  proxy:
    profiles: [tls]
    image: traefik:v3.7.17
    network_mode: host
    restart: unless-stopped
    command: [--configFile=/etc/traefik/traefik.yaml]
    volumes:
      - ${SUPERNOVA_CONFIG_DIR}/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ${SUPERNOVA_CONFIG_DIR}/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - ${SUPERNOVA_CONFIG_DIR}/acme:/acme
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
